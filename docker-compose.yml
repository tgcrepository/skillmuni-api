# Local run: gateway + Identity + Learner + CV + Gamification + Assessment + Learning + Muni + Platform + Careers + MySQL + Service Bus emulator + Redis + Azurite.
#   ./scripts/dev-setup.sh && docker compose up --build
# Frontend: set environment.apiBaseUrl to /api/v1 and proxy /api to http://localhost:5080.
name: skillmuni

services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/dev-setup.sh}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?run scripts/dev-setup.sh}
      LEARNER_DB_PASSWORD: ${LEARNER_DB_PASSWORD:?run scripts/dev-setup.sh}
      CV_DB_PASSWORD: ${CV_DB_PASSWORD:?run scripts/dev-setup.sh}
      GAMIFICATION_DB_PASSWORD: ${GAMIFICATION_DB_PASSWORD:?run scripts/dev-setup.sh}
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:?run scripts/dev-setup.sh}
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD:?run scripts/dev-setup.sh}
      MUNI_DB_PASSWORD: ${MUNI_DB_PASSWORD:?run scripts/dev-setup.sh}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?run scripts/dev-setup.sh}
      CAREERS_DB_PASSWORD: ${CAREERS_DB_PASSWORD:?run scripts/dev-setup.sh}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/local/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30

  # SQL Server for the Service Bus emulator's own state (Azure SQL Edge is retired).
  sqledge:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_EDGE_PASSWORD:?run scripts/dev-setup.sh}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 40

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      sqledge:
        condition: service_healthy
    restart: on-failure
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: ${SQL_EDGE_PASSWORD}
    volumes:
      - ./deploy/local/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports: ["5672:5672"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    ports: ["10000:10000"]

  identity:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Identity: server=mysql;port=3306;database=identity;user=identity_svc;password=${IDENTITY_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      # The emulator's documented local key, not a secret.
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPrivateKeyPem: ${AUTH_PRIVATE_KEY_B64}
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}
      Identity__Security__HashKey: ${IDENTITY_HASH_KEY}

  learner:
    build:
      context: .
      dockerfile: src/Services/Learner/Learner.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      azurite:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Learner: server=mysql;port=3306;database=learner;user=learner_svc;password=${LEARNER_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}
      Learner__Security__EncryptionKey: ${LEARNER_ENCRYPTION_KEY:?run scripts/dev-setup.sh}
      # Azurite's documented well-known development account, not a secret.
      Learner__Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;

  cv:
    build:
      context: .
      dockerfile: src/Services/Cv/Cv.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      azurite:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Cv: server=mysql;port=3306;database=cv;user=cv_svc;password=${CV_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}
      Cv__IdentityBaseAddress: http://identity:8080/
      # Azurite's documented well-known development account, not a secret.
      Cv__Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;

  gamification:
    build:
      context: .
      dockerfile: src/Services/Gamification/Gamification.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Gamification: server=mysql;port=3306;database=gamification;user=gamification_svc;password=${GAMIFICATION_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}

  assessment:
    build:
      context: .
      dockerfile: src/Services/Assessment/Assessment.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Assessment: server=mysql;port=3306;database=assessment;user=assessment_svc;password=${ASSESSMENT_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/SkillMuni.Gateway/Dockerfile
    depends_on: [identity, learner, cv, gamification, assessment, learning, muni, platform, careers]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}
      Gateway__IdentityBaseAddress: http://identity:8080/
    ports: ["5080:8080"]

  learning:
    build:
      context: .
      dockerfile: src/Services/Learning/Learning.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Learning: server=mysql;port=3306;database=learning;user=learning_svc;password=${LEARNING_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}

  muni:
    build:
      context: .
      dockerfile: src/Services/Muni/Muni.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Muni: server=mysql;port=3306;database=muni;user=muni_svc;password=${MUNI_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}
      Muni__LearnerBaseAddress: http://learner:8080/
  platform:
    build:
      context: .
      dockerfile: src/Services/Platform/Platform.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: server=mysql;port=3306;database=platform;user=platform_svc;password=${PLATFORM_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}

  careers:
    build:
      context: .
      dockerfile: src/Services/Careers/Careers.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      servicebus:
        condition: service_started
      azurite:
        condition: service_started
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Careers: server=mysql;port=3306;database=careers;user=careers_svc;password=${CAREERS_DB_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ServiceBus__ConnectionString: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      Auth__SigningPublicKeyPem: ${AUTH_PUBLIC_KEY_B64}
      Careers__LearnerBaseAddress: http://learner:8080/
      # Azurite's documented well-known development account, not a secret.
      Careers__Storage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
volumes:
  mysql-data:
