name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SkillMuni.sln

      - name: Build (warnings are errors)
        id: build
        run: set -o pipefail; dotnet build SkillMuni.sln -c Release --no-restore 2>&1 | tee -a ci.log

      - name: Format
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; dotnet format SkillMuni.sln --verify-no-changes --no-restore 2>&1 | tee -a ci.log

      - name: Vulnerable packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet list SkillMuni.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Migrations match the model
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          set -o pipefail
          for svc in Identity Learner Cv Gamification Muni Platform; do
            echo "has-pending-model-changes: $svc"
            dotnet ef migrations has-pending-model-changes \
              --project src/Services/$svc/$svc.Infrastructure \
              --startup-project src/Services/$svc/$svc.Api \
              --configuration Release --no-build 2>&1 | tee -a ci.log
          done

      - name: Test (unit + Testcontainers MySQL)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: set -o pipefail; dotnet test SkillMuni.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults 2>&1 | tee -a ci.log

      - name: Post results to the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch ci.log
          {
            echo "### CI results (${GITHUB_SHA::7}): ${{ job.status }}"
            echo '```'
            grep -E "(Passed|Failed)! +-" ci.log | sed -E "s/^.*((Passed|Failed)!)/\1/; s/ \(net[0-9.]+\)//" || true
            echo "Tests passed: $(grep -cE '^\s+Passed ' ci.log), failed: $(grep -cE '^\s+Failed ' ci.log)"
            echo '```'
            echo '```'
            grep -E -A4 ": error |error [A-Z]+[0-9]+|warning [A-Z]+[0-9]+|Failed |Error Message|Assert\.|has-pending|Unhandled|Exception:" ci.log | grep -v -E "^\s+at (System|Microsoft|Xunit|MySql)\." \
              | sed -E "s|$GITHUB_WORKSPACE/||g; s/ \[[^]]*\.csproj[^]]*\]$//" | awk '!seen[$0]++' | head -600
            echo '```'
          } > summary.md
          head -c 60000 summary.md > body.md
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments -F body=@body.md > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Identity
        run: docker build -f src/Services/Identity/Identity.Api/Dockerfile -t skillmuni-identity:${{ github.sha }} .
      - name: Learner
        run: docker build -f src/Services/Learner/Learner.Api/Dockerfile -t skillmuni-learner:${{ github.sha }} .
      - name: CV
        run: docker build -f src/Services/Cv/Cv.Api/Dockerfile -t skillmuni-cv:${{ github.sha }} .
      - name: Gamification
        run: docker build -f src/Services/Gamification/Gamification.Api/Dockerfile -t skillmuni-gamification:${{ github.sha }} .
      - name: Muni
        run: docker build -f src/Services/Muni/Muni.Api/Dockerfile -t skillmuni-muni:${{ github.sha }} .
      - name: Platform
        run: docker build -f src/Services/Platform/Platform.Api/Dockerfile -t skillmuni-platform:${{ github.sha }} .
      - name: Gateway
        run: docker build -f src/Gateway/SkillMuni.Gateway/Dockerfile -t skillmuni-gateway:${{ github.sha }} .

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build templates
        run: |
          az bicep install
          az bicep build --file deploy/bicep/main.bicep --stdout > /dev/null
