name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SkillMuni.sln

      - name: Build (warnings are errors)
        run: dotnet build SkillMuni.sln -c Release --no-restore

      - name: Format
        run: dotnet format SkillMuni.sln --verify-no-changes --no-restore

      - name: Vulnerable packages
        run: |
          dotnet list SkillMuni.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          for svc in Identity Learner Cv Gamification; do
            dotnet ef migrations has-pending-model-changes \
              --project src/Services/$svc/$svc.Infrastructure \
              --startup-project src/Services/$svc/$svc.Api \
              --configuration Release --no-build
          done

      - name: Test (unit + Testcontainers MySQL)
        run: dotnet test SkillMuni.sln -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Identity
        run: docker build -f src/Services/Identity/Identity.Api/Dockerfile -t skillmuni-identity:${{ github.sha }} .
      - name: Learner
        run: docker build -f src/Services/Learner/Learner.Api/Dockerfile -t skillmuni-learner:${{ github.sha }} .
      - name: CV
        run: docker build -f src/Services/Cv/Cv.Api/Dockerfile -t skillmuni-cv:${{ github.sha }} .
      - name: Gamification
        run: docker build -f src/Services/Gamification/Gamification.Api/Dockerfile -t skillmuni-gamification:${{ github.sha }} .
      - name: Gateway
        run: docker build -f src/Gateway/SkillMuni.Gateway/Dockerfile -t skillmuni-gateway:${{ github.sha }} .

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build templates
        run: |
          az bicep install
          az bicep build --file deploy/bicep/main.bicep --stdout > /dev/null
